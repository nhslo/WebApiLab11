<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Task Tracker</title><link rel="stylesheet" href="/static/style.css"></head><body><h1>Task Tracker</h1><p>Всего: {{.TotalTasks}} | Выполнено: {{.CompletedTasks}} | Не выполнено: {{.PendingTasks}}</p><form method="post" action="/tasks"><input name="title" placeholder="Название задачи" required><button>Добавить</button></form><ul>{{range .Tasks}}<li>{{.Title}} — {{if .Completed}}Выполнена{{else}}Не выполнена{{end}} <form method="post" action="/tasks/complete"><input type="hidden" name="id" value="{{.ID}}"><button>Изменить статус</button></form> <form method="post" action="/tasks/delete"><input type="hidden" name="id" value="{{.ID}}"><button>Удалить</button></form></li>{{else}}<li>Задач пока нет</li>{{end}}</ul><a href="/about">О приложении</a></body></html>
